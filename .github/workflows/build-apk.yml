name: Build Hybrid WhatsApp Bot APKs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Debug & Signed Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Debug and Release APKs
        working-directory: ./android-app
        run: gradle assembleDebug assembleRelease --stacktrace --info

      - name: Upload Installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Hybrid-Bot-Debug-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Hybrid-Bot-Release-APK
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
